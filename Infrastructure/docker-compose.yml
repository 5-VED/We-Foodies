version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: ../Api-Gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://auth-service:3001
      # - ORDER_SERVICE_URL=http://order-service:3002
      # - NOTIFICATION_SERVICE_URL=http://notification-service:3003
    depends_on:
      - auth-service
      # - order-service
      # - notification-service
    networks:
      - swiggy-network

  # Auth Service
  auth-service:
    build:
      context: ../Services/Auth-Service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEMORY_USAGE_TIMEOUT=60000
      - JWT_SECRET=Q3Z3VHN5aElVdnZGb...Vja0pBTExrYVc3Uk5K
      - JWT_EXPIRES_IN=1d
    depends_on:
      - postgresql
      - redis
    networks:
      - swiggy-network
    volumes:
      - ../Data/Auth-Service:/app
      - /app/node_modules
    command: npm run start:dev

  # Order Service
  # order-service:
  #   build:
  #     context: ../Services/Order-Service
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3002:3002"
  #   environment:
  #     - NODE_ENV=development
  #     - MONGODB_URI=mongodb://mongodb:27017/orders
  #     - RABBITMQ_URL=amqp://rabbitmq:5672
  #   depends_on:
  #     - mongodb
  #     - rabbitmq
  #   networks:
  #     - swiggy-network

  # # Notification Service
  # notification-service:
  #   build:
  #     context: ../Services/Notification-Service
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3003:3003"
  #   environment:
  #     - NODE_ENV=development
  #     - MONGODB_URI=mongodb://mongodb:27017/notifications
  #     - RABBITMQ_URL=amqp://rabbitmq:5672
  #   depends_on:
  #     - mongodb
  #     - rabbitmq
  #   networks:
  #     - swiggy-network

  # MongoDB
  # mongodb:
  #   image: mongo:latest
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data:/data/db
  #   networks:
  #     - swiggy-network

  # PostgreSQL
  postgresql:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swiggy-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgresql

  # Redis
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - swiggy-network

  # RabbitMQ
  # rabbitmq:
  #   image: rabbitmq:3-management
  #   ports:
  #     - "5672:5672"   # AMQP protocol port
  #     - "15672:15672" # Management UI port
  #   environment:
  #     - RABBITMQ_DEFAULT_USER=guest
  #     - RABBITMQ_DEFAULT_PASS=guest
  #   volumes:
  #     - rabbitmq_data:/var/lib/rabbitmq
  #   networks:
  #     - swiggy-network

networks:
  swiggy-network:
    driver: bridge

volumes:
  mongodb_data:
  postgres_data:
  redis_data:
#   rabbitmq_data: